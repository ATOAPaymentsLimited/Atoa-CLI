# Prod release for Linux binaries.
#
# UAT builds (linux-build.yml) upload the same binaries as a private Actions
# artifact. This workflow is the prod counterpart: on a `v*` tag it runs the
# identical build/sign steps but attaches the binaries + checksums to the tag's
# public GitHub Release, which is the only channel end users install from
# (see scripts/install.sh and the README install docs).

name: Release Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create/update the GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: UAT # GPG_PRIVATE_KEY / GPG_KEY_ID currently live in this environment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package Linux x64 binary
        run: npx @yao-pkg/pkg . --targets node20-linux-x64 --output dist/atoa-linux-x64

      - name: Fetch arm64 native keyring binding
        # npm ci above only installs the x64 build of @napi-rs/keyring's native
        # module. The arm64 target needs its own prebuilt .node binding pulled
        # in so pkg's asset glob (see package.json "pkg.assets") can bundle it.
        run: npm install --no-save --force @napi-rs/keyring-linux-arm64-gnu

      - name: Package Linux arm64 binary
        run: npx @yao-pkg/pkg . --targets node20-linux-arm64 --output dist/atoa-linux-arm64

      - name: Make binaries executable
        run: chmod +x dist/atoa-linux-x64 dist/atoa-linux-arm64

      - name: Generate checksums
        working-directory: dist
        run: sha256sum atoa-linux-x64 atoa-linux-arm64 > SHA256SUMS

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Sign checksums
        working-directory: dist
        run: |
          gpg --batch --yes \
            --local-user "${{ secrets.GPG_KEY_ID }}" \
            --output SHA256SUMS.asc --detach-sign --armor SHA256SUMS

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # Tags containing a hyphen (e.g. v0.1.2-rc.1) are treated as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/atoa-linux-x64
            dist/atoa-linux-arm64
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
