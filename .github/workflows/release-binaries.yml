# Prod release of the standalone CLI binaries.
#
# On a `v*` tag this builds each platform's binary on its native runner, signs it
# (Authenticode on Windows; detached GPG over the checksum manifest for all),
# then a single `publish` job attaches everything to one public GitHub Release.
# That release is the only channel scripts/install.sh and scripts/install.ps1
# pull from. This is separate from release.yml (npm) and from the branch-
# triggered UAT builds (linux-build-uat.yml / windows-build-uat.yml).
#
#   git tag v0.1.2 && git push origin v0.1.2
#
# A macOS build job is scaffolded but commented out below (it needs Apple
# Developer signing/notarization set up first). Uncomment it and add it back to
# `publish.needs` to start shipping macOS binaries.

name: Release Binaries

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; only the publish job may write the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package Linux x64 binary
        run: npx @yao-pkg/pkg . --targets node20-linux-x64 --output dist/atoa-linux-x64

      # Credentials are stored in a plain file (no @napi-rs/keyring native
      # module as of v0.2.0), so the bundle is pure JS and arm64 cross-builds
      # on the x64 runner with no extra native binding to fetch.
      - name: Package Linux arm64 binary
        run: npx @yao-pkg/pkg . --targets node20-linux-arm64 --output dist/atoa-linux-arm64

      - name: Make binaries executable
        run: chmod +x dist/atoa-linux-x64 dist/atoa-linux-arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/atoa-linux-*
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    environment: UAT # AZURE_* signing creds live in this environment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package Windows binary
        run: npx @yao-pkg/pkg . --targets node20-win-x64 --output dist/atoa-windows-x64.exe

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Sign Windows binary
        uses: azure/artifact-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          trusted-signing-account-name: AtoaCLI
          certificate-profile-name: atoa-cert-profile
          files-folder: dist/
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/atoa-windows-x64.exe
          retention-days: 1

