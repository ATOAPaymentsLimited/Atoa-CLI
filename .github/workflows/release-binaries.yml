  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    environment: UAT # GPG_PRIVATE_KEY / GPG_KEY_ID live in this environment
    permissions:
      contents: write # required to create/update the GitHub Release
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        working-directory: dist
        run: sha256sum atoa-* > SHA256SUMS

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Sign checksums
        working-directory: dist
        run: |
          gpg --batch --yes \
            --local-user "${{ secrets.GPG_KEY_ID }}" \
            --output SHA256SUMS.asc --detach-sign --armor SHA256SUMS

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # Tags containing a hyphen (e.g. v0.1.2-rc.1) are treated as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
