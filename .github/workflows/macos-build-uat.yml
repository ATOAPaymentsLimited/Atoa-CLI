# UAT build for macOS binaries (internal testing only).
#
# Mirrors linux-build-uat.yml / windows-build-uat.yml: on a push to hotfix/* or
# release/* it packages the standalone binaries, codesigns + notarizes them with
# the Apple Developer ID, and uploads them as a private GitHub Actions artifact.
#
# This is the same signing chain the PROD release-binaries.yml macOS job uses;
# running it on UAT lets us validate signing + notarization end-to-end before it
# reaches main. Requires these secrets in the UAT environment (see
# docs/macos-signing-setup.html): APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD,
# APPLE_SIGN_IDENTITY, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8_BASE64.

name: macOS Build UAT

on:
  push:
    branches:
      - 'hotfix/*'
      - 'release/*'

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: macos-latest # arm64; the x64 target cross-builds from here
    environment: UAT # GPG + Apple signing secrets live in this environment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package macOS arm64 binary
        run: npx @yao-pkg/pkg . --targets node20-macos-arm64 --output dist/atoa-darwin-arm64

      # Credentials are stored in a plain file (no @napi-rs/keyring native module
      # as of v0.2.0), so the bundle is pure JS and the x64 target cross-builds on
      # the arm64 runner with no extra native binding to fetch.
      - name: Package macOS x64 binary
        run: npx @yao-pkg/pkg . --targets node20-macos-x64 --output dist/atoa-darwin-x64

      - name: Make binaries executable
        run: chmod +x dist/atoa-darwin-arm64 dist/atoa-darwin-x64

      - name: Import Apple signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$APPLE_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_CERT_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$APPLE_CERT_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Codesign binaries
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          for f in dist/atoa-darwin-arm64 dist/atoa-darwin-x64; do
            codesign --force --timestamp --options runtime \
              --sign "$APPLE_SIGN_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done

      - name: Notarize binaries
        # A bare Mach-O binary can't be stapled (stapling only applies to
        # .app/.dmg/.pkg), so Gatekeeper does an online notarization check.
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/api_key.p8"
          for f in dist/atoa-darwin-arm64 dist/atoa-darwin-x64; do
            ditto -c -k --keepParent "$f" "${f}.zip"
            xcrun notarytool submit "${f}.zip" \
              --key "$RUNNER_TEMP/api_key.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait
            rm -f "${f}.zip"
          done
          rm -f "$RUNNER_TEMP/api_key.p8"

      # Checksums are computed AFTER signing so they match the final binaries.
      - name: Generate checksums
        working-directory: dist
        # macOS ships `shasum`, not GNU `sha256sum`; -a 256 selects SHA-256.
        run: shasum -a 256 atoa-darwin-arm64 atoa-darwin-x64 > SHA256SUMS

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Sign checksums
        working-directory: dist
        run: |
          gpg --batch --yes \
            --local-user "${{ secrets.GPG_KEY_ID }}" \
            --output SHA256SUMS.asc --detach-sign --armor SHA256SUMS

      - name: Compute artifact name
        shell: bash
        run: echo "ARTIFACT_NAME=atoa-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/atoa-darwin-arm64
            dist/atoa-darwin-x64
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          retention-days: 30
